<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Books — Michaela Nunn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      background-image: url('noise.png');
      background-size: 200px 200px;
      background-repeat: repeat;
      color: #f5f5f5;
      font-family: "Courier New", monospace;
    }
    .page {
      max-width: 900px;
      margin: 40px auto 80px;
      padding: 0 18px;
      text-align: center;
    }
    .nav {
      text-align: left;
      margin-bottom: 26px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .nav a {
      color:#f5f5f5;
      text-decoration:none;
      opacity:0.7;
    }
    .nav a:hover {
      opacity:1;
      text-decoration:underline;
      letter-spacing:0.08em;
      background-color:#111;
    }
    .cover {
      display:block;
      margin:32px auto;
      max-width:280px;
      width:100%;
      border:1px solid #222;
    }
    .divider {
      height:1px;
      background:#222;
      max-width:340px;
      margin:18px auto 26px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="nav">
      <a href="index.html">← back</a>
    </div>

    <img src="covers/naval-almanack.jpg" alt="Naval's Almanack" class="cover" />
    <div class="divider"></div>

    <img src="covers/harassment-architecture.jpg" alt="Harassment Architecture" class="cover" />
    <div class="divider"></div>

    <img src="covers/simulacra-simulation.jpg" alt="Simulacra and Simulation" class="cover" />
    <div class="divider"></div>

    <img src="covers/book4.jpg" alt="" class="cover" />
    <div class="divider"></div>

    <img src="covers/book5.jpg" alt="" class="cover" />
    <div class="divider"></div>

        <img src="covers/book6.jpg" alt="" class="cover" />
    <div class="divider"></div>

      <img src="covers/book7.jpg" alt="" class="cover" />
    <div class="divider"></div>

         <img src="covers/book8.jpg" alt="" class="cover" />
    <div class="divider"></div> 
  </div>
</body>
</html>
