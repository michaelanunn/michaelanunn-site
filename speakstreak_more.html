    }
    .spec-title {
      font-size: 16px;
      color: #f5f5f5;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .spec-body {
      font-size: 15px;
      color: #e0e0e0;
      white-space: pre-line;
    }
    .section-label {
      color: #f5f5f5;
      font-size: 15px;
      margin-top: 24px;

      font-weight: bold;

      text-transform: uppercase;

    .figma-link {
