<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Media — Michaela Nunn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      background-image: url('noise.png');
      background-size: 200px 200px;
      background-repeat: repeat;
      color: #f5f5f5;
      font-family: "Courier New", monospace;
    }
    .page {
      max-width: 900px;
      margin: 40px auto 80px;
      padding: 0 18px;
    }
    .nav {
      text-align: left;
      margin-bottom: 26px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .nav a {
      color:#f5f5f5;
      text-decoration:none;
      opacity:0.7;
    }
    .nav a:hover {
      opacity:1;
      text-decoration:underline;
      letter-spacing:0.08em;
      background-color:#111;
    }
    .frame {
      margin: 40px auto;
      max-width: 420px;
      border: 1px solid #222;
      padding: 6px;
      background-color: rgba(5,5,5,0.9);
    }
    .frame img {
      display:block;
      width:100%;
      height:auto;
    }
    .audio-bar {
      max-width:420px;
      margin: 10px auto 0;
      padding: 6px 8px;
      background: rgba(20,20,20,0.6);
      border: 1px solid #222;
    }
    .audio-bar audio {
      width:100%;
      display:block;
      outline:none;
      background:transparent;
    }
    .line {
      height:1px;
      background:#333;
      max-width:360px;
      margin:22px auto 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="nav">
      <a href="index.html">← back</a>
    </div>

    <div class="frame">
      <img src="media/img1.jpg" alt="media 1" />
    </div>
    <div class="audio-bar">
      <audio controls preload="none">
        <source src="media/audio1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
    <div class="line"></div>

    <div class="frame">
      <img src="media/img2.jpg" alt="media 2" />
    </div>
    <div class="audio-bar">
      <audio controls preload="none">

        Your browser does not support the audio element.
      </audio>
    </div>
    <div class="line"></div>

    <div class="frame">
      <img src="media/img3.jpg" alt="media 3" />
    </div>
    <div class="line"></div>

    <div class="frame">
      <img src="media/img4.jpg" alt="media 4" />
    </div>

    <div class="line"></div>

</html>
