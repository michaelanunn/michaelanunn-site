<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Harvey Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      background-image: url('noise.png');
      background-size: 200px 200px;
      background-repeat: repeat;
      color: #f5f5f5;
      font-family: "Courier New", monospace;
    }

    .page {
      max-width: 980px;
      margin: 40px auto 80px;
      padding: 0 18px;
    }

    .top {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
    }

    .sub {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 8px;
    }

    .nav {
      margin-top: 18px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .nav a {
      color: #f5f5f5;
      text-decoration: none;
    }

    .nav a:hover {
      letter-spacing: 0.2em;
      text-decoration: underline;
      background-color: #111;
    }

    .grid {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 22px;
    }

    .polaroid {
      background-color: #fdfdfd;
      color: #111;
      padding: 10px 10px 16px;
      border-radius: 2px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.55);
      border: 1px solid #222;
      transform: rotate(-1deg);
      transition: transform 160ms ease-out, box-shadow 160ms ease-out;
      position: relative;
    }

    .polaroid:nth-child(3n) {
      transform: rotate(1.8deg);
    }

    .polaroid:nth-child(4n) {
      transform: rotate(-2.4deg);
    }

    .polaroid:hover {
      transform: translateY(-4px) rotate(0deg);
      box-shadow: 0 12px 28px rgba(0,0,0,0.8);
    }

    .polaroid-inner {
      background: #000;
      border: 1px solid #333;
      padding: 4px;
      overflow: hidden;
    }

    .polaroid img {
      width: 100%;
      height: auto;
      display: block;
      filter: blur(4px) grayscale(1);
      transform: scale(1.03);
      transition: filter 160ms ease-out, transform 160ms ease-out;
    }

    .polaroid:hover img {
      filter: blur(0px) grayscale(0);
      transform: scale(1.0);
    }

    .polaroid-caption {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.55;
      text-align: center;
    }

    .timeline-bar {
      margin: 10px auto 0;
      height: 1px;
      max-width: 120px;
      background: #222;
      opacity: 0.9;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .polaroid {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <h1>Harvey Room</h1>
      <div class="sub">
        private archive
      </div>
      <div class="nav">
        <a href="vault.html">close vault</a>
      </div>
      <div class="timeline-bar"></div>
    </div>

    <div id="grid" class="grid">
      <!-- JS will inject polaroids here -->
    </div>
  </div>

<script>
(function () {
  // CONFIG — how many images you *might* have:
  var maxImages = 200; // increase if needed
  var prefix = "media/harvey/";
  var baseName = "h"; // filenames: h1, h2, h3...
  var exts = [".jpg", ".jpeg", ".JPG", ".JPEG"];

  var grid = document.getElementById("grid");

  function addPolaroid(src, index) {
    var card = document.createElement("div");
    card.className = "polaroid";

    var inner = document.createElement("div");
    inner.className = "polaroid-inner";

    var img = document.createElement("img");
    img.src = src;
    img.alt = "";

    inner.appendChild(img);
    card.appendChild(inner);

    var caption = document.createElement("div");
    caption.className = "polaroid-caption";
    caption.textContent = "frame " + index;
    card.appendChild(caption);

    grid.appendChild(card);
  }

  function tryLoadImage(n) {
    var tried = 0;
    var loaded = false;

    function tryNextExt() {
      if (loaded || tried >= exts.length) return;

      var path = prefix + baseName + n + exts[tried];
      var img = new Image();

      img.onload = function () {
        loaded = true;
        addPolaroid(path, n);
      };

      img.onerror = function () {
        tried++;
        tryNextExt(); // try the next extension
      };

      img.src = path;
    }

    tryNextExt();
  }

  for (var i = 1; i <= maxImages; i++) {
    tryLoadImage(i);
  }
})();
</script>

</body>
</html>
