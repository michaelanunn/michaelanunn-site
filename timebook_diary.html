<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Timebook Diary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    body {
      background: #000 url('noise.png') repeat;
      color: #f5f5f5;
      font-family: 'Courier New', monospace;
      margin: 0;
      padding: 0 0 60px 0;
      min-height: 100vh;
    }
    .sticky-top {
      position: sticky;
      top: 0;
      background: #181818;
      padding: 12px 0 8px 0;
      z-index: 100;
      border-bottom: 1px solid #333;
      text-align: center;
    }
    .container {
      max-width: 700px;
      margin: 40px auto 0 auto;
      background: rgba(20,20,20,0.92);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 36px 32px 32px 32px;
      box-shadow: 0 2px 16px #000a;
    }
    h1 {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 20px;
      margin-bottom: 18px;
      text-align: center;
    }
    .diary-locked {
      text-align: center;
      margin-top: 60px;
    }
    .diary-entry {
      background: #181818;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 18px 16px;
      margin-bottom: 24px;
      color: #e0e0e0;
      font-size: 1.08em;
      white-space: pre-line;
    }
    .error {
      color: #c66;
      margin-top: 10px;
      height: 14px;
      font-size: 11px;
    }
    .diary-form {
      margin-top: 32px;
      text-align: center;
    }
    .diary-form textarea {
      width: 90%;
      min-height: 120px;
      background: #111;
      color: #f5f5f5;
      border: 1px solid #444;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 1em;
      padding: 10px;
      margin-bottom: 12px;
      resize: vertical;
    }
    .diary-form button {
      padding: 8px 22px;
      border: 1px solid #f5f5f5;
      background: #000;
      color: #f5f5f5;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      cursor: pointer;
      border-radius: 8px;
    }
    .diary-form button:hover {
      background: #111;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="sticky-top">
    <a href="vault.html">Back to Vault</a>
  </div>
  <div class="container">
    <h1>Timebook Diary</h1>
    <div id="diary-locked" class="diary-locked">
      <form id="diary-unlock-form">
        <input type="password" id="diary-password" placeholder="Enter password" autocomplete="off" />
        <button type="submit">Unlock Diary</button>
        <div id="diary-error" class="error"></div>
      </form>
    </div>
    <div id="diary-content" style="display:none;">
      <div id="diary-entries"></div>
      <form id="diary-form" class="diary-form">
        <textarea id="diary-text" placeholder="Write your diary entry..."></textarea><br />
        <button type="submit">Add Entry</button>
      </form>
    </div>
  </div>
  <script>
    // Encryption key
    var DIARY_KEY = 'timebook123!';
    // Try to load encrypted diary from localStorage
    function loadDiary() {
      var encrypted = localStorage.getItem('diary_encrypted');
      if (!encrypted) return [];
      try {
        var decrypted = CryptoJS.AES.decrypt(encrypted, DIARY_KEY).toString(CryptoJS.enc.Utf8);
        return JSON.parse(decrypted) || [];
      } catch (e) {
        return [];
      }
    }
    function saveDiary(entries) {
      var data = JSON.stringify(entries);
      var encrypted = CryptoJS.AES.encrypt(data, DIARY_KEY).toString();
      localStorage.setItem('diary_encrypted', encrypted);
    }
    function renderDiary(entries) {
      var container = document.getElementById('diary-entries');
      container.innerHTML = '';
      entries.forEach(function(entry) {
        var div = document.createElement('div');
        div.className = 'diary-entry';
        div.textContent = entry.date + '\n' + entry.text;
        container.appendChild(div);
      });
    }
    document.getElementById('diary-unlock-form').onsubmit = function(e) {
      e.preventDefault();
      var pw = document.getElementById('diary-password').value;
      if (pw === DIARY_KEY) {
        document.getElementById('diary-locked').style.display = 'none';
        document.getElementById('diary-content').style.display = 'block';
        var entries = loadDiary();
        renderDiary(entries);
      } else {
        document.getElementById('diary-error').textContent = 'access denied.';
      }
    };
    document.getElementById('diary-form').onsubmit = function(e) {
      e.preventDefault();
      var text = document.getElementById('diary-text').value.trim();
      if (!text) return;
      var entries = loadDiary();
      var now = new Date();
      var date = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      entries.unshift({date: date, text: text});
      saveDiary(entries);
      renderDiary(entries);
      document.getElementById('diary-text').value = '';
    };
  </script>
</body>
</html>
